# Module của Blackbox Exporter.
# timeout phải nhỏ hơn scrape_timeout của Prometheus (10s) và LỚN HƠN ngưỡng "endpoint chậm"
# để probe chậm vẫn đo được thời gian thay vì bị cắt.
modules:
  http_2xx:
    prober: http
    timeout: 8s
    http:
      method: GET
      valid_status_codes: []        # mặc định 2xx
      preferred_ip_protocol: ip4
      no_follow_redirects: false

  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
