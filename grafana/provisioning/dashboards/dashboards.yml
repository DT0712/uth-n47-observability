apiVersion: 1

# Dashboard được nạp từ file JSON trong grafana/dashboards (quản lý bằng git).
# Sửa trên UI sẽ KHÔNG được lưu lại vào file: muốn giữ thay đổi thì Export JSON -> ghi đè file -> commit.
providers:
  - name: infra-observability-lab
    orgId: 1
    folder: Infra Observability Lab
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
