# =====================================================================================
#  NGƯỠNG CẢNH BÁO — NƠI DUY NHẤT CẦN SỬA KHI CHỐT NGƯỠNG
# =====================================================================================
# Mỗi ngưỡng là một recording rule trả về hằng số: lab:threshold:<tên>.
# Luật trong alerts.yml so sánh chỉ số với chuỗi này, nên khi đổi ngưỡng KHÔNG cần sửa alerts.yml.
# Dashboard Grafana cũng đọc các chuỗi này để vẽ đường ngưỡng.
#
# TRẠNG THÁI HIỆN TẠI: "provisional" (TẠM THỜI).
#   Các giá trị dưới đây CHƯA phải ngưỡng chính thức. Chúng chỉ đủ để chạy thử các kịch bản lỗi
#   (vd. stress CPU đẩy lên ~100%, lấp ổ lab tới 95%, tiêm độ trễ 3s). Quy trình chốt ngưỡng:
#     1. Chạy hệ thống bình thường và đo baseline:  python scripts/baseline.py --minutes 60
#     2. Xem results/baseline/<thời điểm>/baseline.md (min/mean/p95/p99/max + giá trị gợi ý).
#     3. Nhóm thống nhất giá trị, sửa "expr" bên dưới, đổi threshold_status thành "baselined"
#        và ghi nguồn gốc vào nhãn "basis" (vd. "baseline 2026-11-20 p99+3sd").
#     4. Kiểm tra cú pháp + nạp lại:  python scripts/reload.py
#   Ghi lại lý do chọn ngưỡng trong docs/bao-cao-thu-nghiem.md.
#
# Lưu ý: thời gian "for" (phải vượt ngưỡng liên tục bao lâu mới báo) nằm trong alerts.yml vì
# Prometheus không cho tham số hoá "for". Đó cũng là tham số cần tinh chỉnh sau baseline.
# =====================================================================================

groups:
  - name: lab-thresholds
    interval: 15s
    rules:
      # --- Host --------------------------------------------------------------
      - record: lab:threshold:host_cpu_usage_percent        # % CPU (trung bình mọi lõi)
        expr: vector(85)
        labels: { threshold_status: provisional, basis: "chua do baseline" }

      - record: lab:threshold:host_memory_usage_percent     # % RAM đã dùng (1 - MemAvailable/MemTotal)
        expr: vector(90)
        labels: { threshold_status: provisional, basis: "chua do baseline" }

      - record: lab:threshold:filesystem_usage_percent      # % dung lượng đĩa đã dùng
        expr: vector(90)
        labels: { threshold_status: provisional, basis: "chua do baseline" }

      # --- Endpoint (Blackbox) -------------------------------------------------
      - record: lab:threshold:endpoint_probe_duration_seconds   # thời gian probe HTTP /health
        expr: vector(2)
        labels: { threshold_status: provisional, basis: "chua do baseline" }

      # --- Dịch vụ (metric ứng dụng) -------------------------------------------
      - record: lab:threshold:service_latency_p95_seconds   # p95 thời gian xử lý /api/work
        expr: vector(1)
        labels: { threshold_status: provisional, basis: "chua do baseline" }

      - record: lab:threshold:service_error_ratio           # tỉ lệ 5xx trên /api/work (0..1)
        expr: vector(0.05)
        labels: { threshold_status: provisional, basis: "chua do baseline" }

      - record: lab:threshold:service_min_request_rate_rps  # dưới lưu lượng này không xét tỉ lệ lỗi (chống báo giả)
        expr: vector(0.2)
        labels: { threshold_status: provisional, basis: "chua do baseline" }
