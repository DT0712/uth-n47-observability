# Luật cảnh báo. Giá trị ngưỡng KHÔNG nằm ở đây mà ở thresholds.yml (chuỗi lab:threshold:*).
# Mẫu so sánh:  <chỉ số> > on() group_left() lab:threshold:<tên>
#   - on()          : so khớp không theo nhãn nào (ngưỡng là một chuỗi duy nhất)
#   - group_left()  : giữ nguyên nhãn của chỉ số bên trái (instance, host, service, ...)
# Mỗi alert có annotation "runbook" trỏ tới runbooks/<alertname>.md (portal hiển thị theo alertname).
#
# Thời gian "for" hiện cũng là giá trị TẠM THỜI — tinh chỉnh sau khi đo baseline và tỉ lệ báo giả.
#
# keep_firing_for trên các cảnh báo là NGUỒN của inhibit_rules (ServiceDown, NginxDown, PostgresDown,
# TargetDown): khi dịch vụ phục hồi, cảnh báo gốc giữ firing thêm 45s để các cảnh báo hệ quả (cần thêm 1 lần
# scrape + đánh giá, tối đa ~30s) resolve trước. Nếu không, inhibit bị gỡ sớm và Alertmanager gửi các thông
# báo "firing" giả lúc khôi phục (đã quan sát khi thử dừng Nginx ở GĐ2). Đổi lại: thông báo resolved của cảnh
# báo gốc trễ 45s — không ảnh hưởng thời gian PHÁT HIỆN.

groups:
  - name: lab-alerts-host
    rules:
      - alert: HostHighCpu
        expr: lab:host_cpu_usage:percent > on() group_left() lab:threshold:host_cpu_usage_percent
        for: 1m
        labels: { severity: warning, category: host }
        annotations:
          summary: "CPU VM {{ $labels.instance }} cao: {{ $value | printf \"%.1f\" }}%"
          description: >-
            CPU trung bình vượt ngưỡng {{ with query "lab:threshold:host_cpu_usage_percent" }}{{ . | first | value }}{{ end }}%
            liên tục trong 1 phút.
          runbook: runbooks/HostHighCpu.md

      - alert: HostHighMemory
        expr: lab:host_memory_usage:percent > on() group_left() lab:threshold:host_memory_usage_percent
        for: 1m
        labels: { severity: warning, category: host }
        annotations:
          summary: "RAM VM {{ $labels.instance }} cao: {{ $value | printf \"%.1f\" }}%"
          description: >-
            RAM đã dùng vượt ngưỡng {{ with query "lab:threshold:host_memory_usage_percent" }}{{ . | first | value }}{{ end }}%
            liên tục trong 1 phút.
          runbook: runbooks/HostHighMemory.md

      - alert: HostDiskAlmostFull
        expr: lab:filesystem_usage:percent > on() group_left() lab:threshold:filesystem_usage_percent
        for: 1m
        labels: { severity: warning, category: host }
        annotations:
          summary: "Đĩa {{ $labels.mountpoint }} trên VM {{ $labels.instance }} gần đầy: {{ $value | printf \"%.1f\" }}%"
          description: >-
            Dung lượng đã dùng vượt ngưỡng {{ with query "lab:threshold:filesystem_usage_percent" }}{{ . | first | value }}{{ end }}%.
          runbook: runbooks/HostDiskAlmostFull.md

  - name: lab-alerts-service
    rules:
      - alert: ServiceDown
        expr: up{job="demo-app"} == 0
        for: 30s
        keep_firing_for: 45s
        labels: { severity: critical, category: service }
        annotations:
          summary: "Demo app trên VM {{ $labels.instance }} không scrape được (down)"
          description: "Prometheus không lấy được /metrics của demo app (qua Nginx) liên tục 30 giây."
          runbook: runbooks/ServiceDown.md

      - alert: NginxDown
        expr: nginx_up{job="nginx"} == 0
        for: 30s
        keep_firing_for: 45s
        labels: { severity: critical, category: service }
        annotations:
          summary: "Nginx trên VM {{ $labels.instance }} không phản hồi"
          description: "nginx-exporter vẫn chạy nhưng không đọc được stub_status liên tục 30 giây — Nginx dừng hoặc lỗi cấu hình."
          runbook: runbooks/NginxDown.md

      - alert: PostgresDown
        expr: pg_up{job="postgres"} == 0
        for: 30s
        keep_firing_for: 45s
        labels: { severity: critical, category: service }
        annotations:
          summary: "PostgreSQL trên VM {{ $labels.instance }} không kết nối được"
          description: "postgres-exporter vẫn chạy nhưng không kết nối được PostgreSQL liên tục 30 giây."
          runbook: runbooks/PostgresDown.md

      - alert: PostgresTooManyConnections
        expr: lab:postgres_connections_usage:percent > on() group_left() lab:threshold:postgres_connections_usage_percent
        for: 1m
        labels: { severity: warning, category: service }
        annotations:
          summary: "PostgreSQL trên VM {{ $labels.instance }} dùng {{ $value | printf \"%.0f\" }}% số kết nối tối đa"
          description: >-
            Số kết nối vượt ngưỡng {{ with query "lab:threshold:postgres_connections_usage_percent" }}{{ . | first | value }}{{ end }}%
            của max_connections liên tục 1 phút.
          runbook: runbooks/PostgresTooManyConnections.md

      - alert: ServiceHighErrorRate
        expr: |
          (lab:service_error_ratio:ratio > on() group_left() lab:threshold:service_error_ratio)
          and on(service)
          (lab:service_request_rate:rps > on() group_left() lab:threshold:service_min_request_rate_rps)
        for: 1m
        labels: { severity: warning, category: service }
        annotations:
          summary: "Tỉ lệ lỗi 5xx của {{ $labels.service }} cao: {{ $value | humanizePercentage }}"
          description: >-
            Tỉ lệ lỗi /api/work vượt ngưỡng {{ with query "lab:threshold:service_error_ratio" }}{{ . | first | value | humanizePercentage }}{{ end }}
            liên tục trong 1 phút.
          runbook: runbooks/ServiceHighErrorRate.md

      - alert: ServiceHighLatency
        expr: lab:service_latency_p95:seconds > on() group_left() lab:threshold:service_latency_p95_seconds
        for: 1m
        labels: { severity: warning, category: service }
        annotations:
          summary: "p95 latency của {{ $labels.service }} cao: {{ $value | humanizeDuration }}"
          description: >-
            p95 thời gian xử lý /api/work vượt ngưỡng {{ with query "lab:threshold:service_latency_p95_seconds" }}{{ . | first | value }}{{ end }}s.
          runbook: runbooks/ServiceHighLatency.md

  - name: lab-alerts-endpoint
    rules:
      - alert: EndpointDown
        expr: probe_success{job=~"blackbox-http|blackbox-tcp"} == 0
        for: 30s
        labels: { severity: critical, category: endpoint }
        annotations:
          summary: "Endpoint {{ $labels.instance }} lỗi ({{ $labels.job }})"
          description: "Blackbox probe thất bại liên tục 30 giây (không kết nối được, sai mã HTTP hoặc quá timeout)."
          runbook: runbooks/EndpointDown.md

      - alert: EndpointSlow
        expr: probe_duration_seconds{job="blackbox-http"} > on() group_left() lab:threshold:endpoint_probe_duration_seconds
        for: 1m
        labels: { severity: warning, category: endpoint }
        annotations:
          summary: "Endpoint {{ $labels.instance }} chậm: {{ $value | humanizeDuration }}"
          description: >-
            Thời gian probe vượt ngưỡng {{ with query "lab:threshold:endpoint_probe_duration_seconds" }}{{ . | first | value }}{{ end }}s
            liên tục trong 1 phút.
          runbook: runbooks/EndpointSlow.md

  - name: lab-alerts-meta
    rules:
      # Exporter/thành phần giám sát mất -> mất dữ liệu (demo-app đã có ServiceDown riêng).
      - alert: TargetDown
        expr: up{job!="demo-app"} == 0
        for: 1m
        keep_firing_for: 45s
        labels: { severity: warning, category: monitoring }
        annotations:
          summary: "Target {{ $labels.job }} ({{ $labels.instance }}) down"
          description: "Prometheus không scrape được target của job {{ $labels.job }} liên tục 1 phút — có thể mất dữ liệu giám sát."
          runbook: runbooks/TargetDown.md

      # Nếu ai đó xoá/đổi tên một ngưỡng, luật tương ứng sẽ im lặng vĩnh viễn -> phải báo.
      - alert: ThresholdConfigMissing
        expr: |
          absent(lab:threshold:host_cpu_usage_percent)
          or absent(lab:threshold:host_memory_usage_percent)
          or absent(lab:threshold:filesystem_usage_percent)
          or absent(lab:threshold:endpoint_probe_duration_seconds)
          or absent(lab:threshold:service_latency_p95_seconds)
          or absent(lab:threshold:service_error_ratio)
          or absent(lab:threshold:service_min_request_rate_rps)
          or absent(lab:threshold:postgres_connections_usage_percent)
        for: 2m
        labels: { severity: warning, category: monitoring }
        annotations:
          summary: "Thiếu ít nhất một chuỗi ngưỡng lab:threshold:*"
          description: "Kiểm tra monitor/prometheus/rules/thresholds.yml — luật dùng ngưỡng bị thiếu sẽ không bao giờ kích hoạt."
          runbook: runbooks/ThresholdConfigMissing.md
