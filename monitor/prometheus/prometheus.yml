# Cấu hình Prometheus cho lab 3 VM. Sau khi sửa file này hoặc rules/: python tools/reload.py
#
# Quy ước nhãn (dashboard, luật cảnh báo và portal dựa vào đây):
#   host     = tên VM (monitor | web | db) — có trên MỌI target
#   instance = tên VM với exporter của host/dịch vụ; URL/địa chỉ với probe Blackbox
#   service  = dịch vụ được giám sát (demo-app | nginx | postgresql) nếu có
#
# Độ trễ phát hiện tối đa ~ scrape_interval + evaluation_interval + "for" + group_wait của Alertmanager.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    lab: infra-observability-lab

rule_files:
  - /etc/prometheus/rules/thresholds.yml   # NGƯỠNG cảnh báo (chỉnh ở đây)
  - /etc/prometheus/rules/recording.yml    # chỉ số dẫn xuất dùng chung cho alert + dashboard
  - /etc/prometheus/rules/alerts.yml       # luật cảnh báo (so sánh chỉ số với ngưỡng)

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # --- Host: Node Exporter trên 3 VM ------------------------------------------------
  - job_name: node
    static_configs:
      - targets: ["monitor:9100"]
        labels: { instance: monitor, host: monitor }
      - targets: ["web:9100"]
        labels: { instance: web, host: web }
      - targets: ["db:9100"]
        labels: { instance: db, host: db }

  # --- Dịch vụ trên VM web ---------------------------------------------------------
  # /metrics của demo app đi qua Nginx (chỉ VM monitor được phép) -> Nginx dừng thì target này cũng DOWN.
  - job_name: demo-app
    static_configs:
      - targets: ["web:80"]
        labels: { instance: web, host: web, service: demo-app }

  - job_name: nginx
    static_configs:
      - targets: ["web:9113"]
        labels: { instance: web, host: web, service: nginx }

  # --- Dịch vụ trên VM db ----------------------------------------------------------
  - job_name: postgres
    static_configs:
      - targets: ["db:9187"]
        labels: { instance: db, host: db, service: postgresql }

  # --- Góc nhìn người dùng: Blackbox probe -------------------------------------------
  - job_name: blackbox-http
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets: ["http://web/health"]
        labels: { host: web, service: demo-app }
    relabel_configs: &blackbox-relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-tcp
    metrics_path: /probe
    params: { module: [tcp_connect] }
    static_configs:
      - targets: ["web:80"]
        labels: { host: web, service: nginx }
      - targets: ["db:5432"]
        labels: { host: db, service: postgresql }
    relabel_configs: *blackbox-relabel

  # --- Chính hệ thống giám sát (cùng mạng Compose trên VM monitor) ------------------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: { instance: prometheus, host: monitor }

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels: { instance: alertmanager, host: monitor }

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels: { instance: grafana, host: monitor }

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]
        labels: { instance: blackbox-exporter, host: monitor }

  # Web portal: metric riêng (NFR-13); portal-api chỉ mở cổng trong mạng Compose
  - job_name: portal-api
    static_configs:
      - targets: ["portal-api:8000"]
        labels: { instance: portal-api, host: monitor, service: portal }

  - job_name: alert-recorder
    static_configs:
      - targets: ["alert-recorder:5001"]
        labels: { instance: alert-recorder, host: monitor }
